stages:
  - verify

backend:
  stage: verify
  image: python:3.12-slim
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  script:
    - python -m pip install -r requirements-dev.txt
    - ruff check server tests scripts
    - ruff format --check server tests scripts
    - python -m pytest -q
    - python scripts/verify_regressions.py

frontend:
  stage: verify
  image: node:22-bookworm-slim
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/.npm/
  script:
    - cd web
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run format:check
    - npm run build
  artifacts:
    paths:
      - web/dist/
    expire_in: 7 days
